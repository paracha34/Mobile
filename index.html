    <!-- Environment Lifecycle & ServiceWorker Protection -->
    <script>
      (function() {
        // 1. Guard ServiceWorker registration against iframe lifecycle invalid states
        if (typeof navigator !== 'undefined' && 'serviceWorker' in navigator) {
          try {
            const origRegister = navigator.serviceWorker.register.bind(navigator.serviceWorker);
            navigator.serviceWorker.register = function(scriptURL, options) {
              try {
                return origRegister(scriptURL, options).catch(function(err) {
                  // Silently suppress DOMException when document is in transition / invalid state
                  return null;
                });
              } catch (e) {
                return Promise.resolve(null);
              }
            };
          } catch (_) {}
        }

        // 2. Prevent unhandled rejections from aborted ServiceWorker registrations in preview iframe
        if (typeof window !== 'undefined') {
          window.addEventListener('unhandledrejection', function(event) {
            if (
              event.reason &&
              (event.reason.message?.includes('invalid state') ||
               event.reason.message?.includes('ServiceWorker') ||
               event.reason.name === 'InvalidStateError')
            ) {
              event.preventDefault();
            }
          });
        }

        // 3. Gracefully handle Vite HMR websocket in preview environment
        if (typeof window === 'undefined' || !window.WebSocket) return;
        const NativeWebSocket = window.WebSocket;
        function PatchedWebSocket(url, protocols) {
          const ws = new NativeWebSocket(url, protocols);
          try {
            const originalAddEventListener = ws.addEventListener.bind(ws);
            ws.addEventListener = function(type, listener, options) {
              if (type === 'close') {
                const safeListener = function(event) {
                  try {
                    Object.defineProperty(event, 'wasClean', { value: true, configurable: true });
                  } catch (_) {}
                  return typeof listener === 'function' ? listener.call(this, event) : listener.handleEvent(event);
                };
                return originalAddEventListener(type, safeListener, options);
              }
              return originalAddEventListener(type, listener, options);
            };
          } catch (_) {}
          return ws;
        }
        PatchedWebSocket.prototype = NativeWebSocket.prototype;
        PatchedWebSocket.CONNECTING = NativeWebSocket.CONNECTING;
        PatchedWebSocket.OPEN = NativeWebSocket.OPEN;
        PatchedWebSocket.CLOSING = NativeWebSocket.CLOSING;
        PatchedWebSocket.CLOSED = NativeWebSocket.CLOSED;
        window.WebSocket = PatchedWebSocket;
      })();
    </script>
