<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9333ea;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4f46e5;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="110" fill="#0a0a0f"/>
  <rect x="16" y="16" width="480" height="480" rx="98" fill="none" stroke="#2a2a3e" stroke-width="4"/>
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#grad1)" stroke-width="8" opacity="0.3"/>
  <g filter="url(#glow)">
    <!-- Stylized G and Z electric bolt icon -->
    <path d="M 280 120 L 190 270 L 260 270 L 230 392 L 340 240 L 270 240 Z" fill="url(#grad1)" />
  </g>
  <!-- Modern Circuit Dots -->
  <circle cx="160" cy="180" r="10" fill="#a855f7" />
  <circle cx="352" cy="332" r="10" fill="#6366f1" />
  <line x1="160" y1="180" x2="200" y2="200" stroke="#a855f7" stroke-width="3" stroke-dasharray="4,4" opacity="0.6"/>
  <line x1="312" y1="312" x2="352" y2="332" stroke="#6366f1" stroke-width="3" stroke-dasharray="4,4" opacity="0.6"/>
</svg>
